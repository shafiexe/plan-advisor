    <line x1="3" y1="6" x2="12" y2="6" stroke="#d4a017" stroke-width="1.2"/>
    <line x1="5" y1="6" x2="2" y2="3.5" stroke="#d4a017" stroke-width="0.9"/>
    <line x1="5" y1="6" x2="2" y2="8.5" stroke="#d4a017" stroke-width="0.9"/>
  </g>
  <!-- Center dot -->
  <circle cx="36" cy="32" r="4.5" fill="#1e3a8a"/>
  <circle cx="36" cy="32" r="2.5" fill="#d4a017"/>

  <!-- "planadviros" wordmark -->
  <text x="82" y="38"
