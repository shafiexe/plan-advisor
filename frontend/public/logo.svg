    L42.8 52.6 L37.6 50.2 L36 56.2
    L34.4 50.2 L29.2 52.6 L28.6 46.5 L22.8 46.5 L24.4 40.7 L18.9 38.4
    L22.3 33.8 L17.8 30.1 L22.3 26.4 L18.9 21.8 L24.4 19.5 L22.8 13.7
