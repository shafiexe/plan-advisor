# ── Plan Advisor — Frontend CI/CD ─────────────────────────────────────────────
# Triggers only when frontend code changes.
# In Azure DevOps: Pipelines → New pipeline → GitHub → select repo
#   → "Existing Azure Pipelines YAML file" → /frontend/azure-pipeline.yml

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - frontend/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - frontend/**

variables:
  - group: plan-advisor-secrets        # Library variable group with all secrets

  - name: AZURE_SERVICE_CONNECTION     # ARM service connection name in Azure DevOps
    value: "plan-advisor-azure"
  - name: ACR_SERVICE_CONNECTION       # Docker Registry service connection name
    value: "plan-advisor-acr"
  - name: ACR_NAME                     # Your Container Registry name (no hyphens)
    value: "planadvisoracr"
  - name: RESOURCE_GROUP
    value: "plan-advisor-rg"
  - name: FRONTEND_APP_NAME
    value: "plan-advisor-frontend"

  # NEXT_PUBLIC_* are baked into the image at build time.
  # Set these to your backend Container App's public URL (from provision.sh output).
  - name: NEXT_PUBLIC_API_URL
    value: "https://plan-advisor-backend.ashyocean-2012629c.eastus.azurecontainerapps.io"
  - name: NEXT_PUBLIC_WS_URL
    value: "wss://plan-advisor-backend.ashyocean-2012629c.eastus.azurecontainerapps.io/ws/chat"

  - name: IMAGE
    value: "$(ACR_NAME).azurecr.io/plan-advisor-frontend"
  - name: TAG
    value: "$(Build.BuildId)"

stages:
  # ── Build ────────────────────────────────────────────────────────────────────
  - stage: Build
    displayName: "Build"
    jobs:
      - job: BuildImage
        displayName: "Build & push frontend image"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: Docker@2
            displayName: "Build and push to ACR"
            inputs:
              containerRegistry: "$(ACR_SERVICE_CONNECTION)"
              repository: "plan-advisor-frontend"
              command: "buildAndPush"
              Dockerfile: "frontend/Dockerfile"
              buildContext: "frontend"
              # NEXT_PUBLIC_* must be passed at build time — they are inlined by Next.js
              arguments: >
                --build-arg NEXT_PUBLIC_API_URL=$(NEXT_PUBLIC_API_URL)
                --build-arg NEXT_PUBLIC_WS_URL=$(NEXT_PUBLIC_WS_URL)
              tags: |
                $(TAG)
                latest

  # ── Deploy (main branch only) ─────────────────────────────────────────────
  - stage: Deploy
    displayName: "Deploy"
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployFrontend
        displayName: "Deploy to Container App"
        environment: "production"
        pool:
          vmImage: "ubuntu-latest"
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: "Update Container App image + env vars"
                  inputs:
                    azureSubscription: "$(AZURE_SERVICE_CONNECTION)"
                    scriptType: "bash"
                    scriptLocation: "inlineScript"
                    inlineScript: |
                      set -euo pipefail

                      FRONTEND_FQDN=$(az containerapp show \
                        --name "$(FRONTEND_APP_NAME)" \
                        --resource-group "$(RESOURCE_GROUP)" \
                        --query "properties.configuration.ingress.fqdn" -o tsv)

                      az containerapp update \
                        --name "$(FRONTEND_APP_NAME)" \
                        --resource-group "$(RESOURCE_GROUP)" \
                        --image "$(IMAGE):$(TAG)" \
                        --set-env-vars \
                          "NEXTAUTH_URL=https://$FRONTEND_FQDN" \
                          "AUTH_TRUST_HOST=true" \
                          "AUTH_SECRET=$(AUTH_SECRET)" \
                          "AUTH_GOOGLE_ID=$(AUTH_GOOGLE_ID)" \
                          "AUTH_GOOGLE_SECRET=$(AUTH_GOOGLE_SECRET)" \
                          "AUTH_GITHUB_ID=$(AUTH_GITHUB_ID)" \
                          "AUTH_GITHUB_SECRET=$(AUTH_GITHUB_SECRET)"

                      echo "Deployed → https://$FRONTEND_FQDN"
