services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    environment:
      # Override vars that differ inside Docker
      REDIS_URL: redis://redis:6379
      ALLOWED_ORIGINS: "http://localhost:3000,https://localhost:3000"
      # SQLite DB persisted in a named volume
      DATABASE_URL: sqlite+aiosqlite:////app/data/plan_advisor.db
    volumes:
      - backend-data:/app/data
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        # Browser connects directly to the exposed backend port — not via
        # the internal Docker network — so these stay as localhost URLs.
        NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws/chat
        NEXT_PUBLIC_API_URL: http://localhost:8000
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: ./frontend/.env.local
    environment:
      NEXTAUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
    depends_on:
      - backend

volumes:
  redis-data:
  backend-data:
